meta:
  name: "4090 Fast"
  description: "Larger 12-layer GPT tuned for RTX 4090-class GPUs with gradient accumulation."

tokenizer:
  vocab_size: 32000
  min_freq: 2

data:
  train_split: 0.9
  seed: 1337

model:
  # ~150–200M params depending on vocab_size
  n_layer: 12
  n_head: 12
  n_embd: 768
  block_size: 256
  dropout: 0.1

train:
  batch_size: 8        # try 48 or 64; reduce if OOM
  grad_accum_steps: 4
  max_steps: 200_000      # more steps = better
  lr: 3e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  warmup_steps: 500
  ckpt_interval: 1000
  log_interval: 500
  amp: true

io:
  out_dir: checkpoints
  processed_dir: data/processed
  raw_dir: data/raw
